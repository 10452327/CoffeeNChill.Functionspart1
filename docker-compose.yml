services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: azurite
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "10001"]
      interval: 5s
      timeout: 3s
      retries: 5

  functions:
    image: guzman70/coffeechill-functions:v2.0
    container_name: coffeechill-functions
    ports:
      - "8080:80"
    environment:
      - AzureWebJobsStorage=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;TableEndpoint=http://azurite:10002/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;BlobEndpoint=http://azurite:10000/devstoreaccount1;
    depends_on:
      azurite:
        condition: service_started

  gateway:
    build:
      context: ./CoffeeNChill.Gateway
      dockerfile: Dockerfile
    container_name: coffeechill-gateway
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__AzureTableStorage: "${AZURE_TABLE_STORAGE_CONNECTION_STRING}"
      JwtSettings__Secret: "${JWT_SECRET}"
      JwtSettings__Issuer: "CoffeeNChill.Gateway"
      JwtSettings__Audience: "CoffeeNChill.Client"
    restart: unless-stopped